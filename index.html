<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Friendship's Apple Cake Season</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--cream:#FAF3E0;--rust:#B5451B;--teal:#2A6B6B;--red:#E84848;--grass:#7CB342;--road:#546E7A;--water:#4FC3F7;--safe:#AED581;--gold:#FFD700}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:manipulation;user-select:none}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .3s}
.ov.hide{opacity:0;pointer-events:none}
#splash{background:linear-gradient(180deg,#E8F5E9,var(--cream),#F5E6C8)}
#scoreOv{background:rgba(250,243,224,.95)}
.logo{font-size:4rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.t1{font-size:1.8rem;color:var(--teal);font-weight:300;letter-spacing:4px;text-align:center;margin-top:6px}
.t2{font-size:2.8rem;color:var(--rust);font-weight:900;text-align:center;margin-top:-4px}
.tag{font-size:.9rem;color:var(--teal);text-align:center;margin-top:10px;font-style:italic;opacity:.7}
.btn{display:block;border:none;padding:14px 48px;border-radius:26px;font-size:1.1rem;font-weight:900;letter-spacing:2px;cursor:pointer;margin:10px auto;text-align:center}
.btn-red{background:linear-gradient(135deg,var(--red),#C73535);color:var(--cream);box-shadow:0 4px 14px rgba(232,72,72,.3)}
.btn-out{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn:active{transform:scale(.96)}
.stars{font-size:3rem;color:var(--gold);letter-spacing:6px;text-align:center}
.cake-r{font-size:1.3rem;color:var(--teal);font-weight:800;text-align:center;margin:6px 0 14px}
.card{background:rgba(255,255,255,.75);border-radius:16px;padding:18px 24px;width:88%;max-width:300px;margin:0 auto 14px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(42,107,107,.08)}
.row:last-child;border:none}
.rl{color:var(--teal);font-weight:600;font-size:.88rem}
.rv{color:var(--rust);font-weight:800;font-size:.95rem}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;pointer-events:none;z-index:5;font-size:.82rem;font-weight:700;color:var(--teal)}
#hudR{text-align:right}
#cakeHud{position:absolute;bottom:16px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:6px;pointer-events:none;z-index:5;font-size:.78rem;color:var(--teal);font-weight:700}
#cakeBar{width:60px;height:8px;background:rgba(0,0,0,.12);border-radius:4px;overflow:hidden}
#cakeFill{height:100%;width:0%;background:var(--rust);border-radius:4px;transition:width .3s}
#pauseB{position:absolute;top:10px;right:10px;z-index:20;background:rgba(255,255,255,.7);border:none;border-radius:18px;width:36px;height:36px;font-size:1rem;cursor:pointer;display:none}
#pauseB.show{display:block}
#pauseOv{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(250,243,224,.88);z-index:15;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--teal);font-weight:800;letter-spacing:2px}
#pauseOv.hide{display:none}
.fp{position:absolute;top:-30px;font-size:1.4rem;pointer-events:none;animation:ff linear forwards}
@keyframes ff{to{transform:translateY(calc(100vh + 60px)) rotate(360deg)}}
</style>
</head>
<body>
<div id="splash" class="ov">
  <div class="logo">🧁</div>
  <div class="t1">Friendship's</div>
  <div class="t2">Apple Cake Season</div>
  <div class="tag">Cross the orchard. Collect apples. Bake the perfect cake.</div>
  <button class="btn btn-red" id="pBtn" style="margin-top:24px">PLAY</button>
</div>
<canvas id="gc"></canvas>
<div id="hud"><span id="hudL"></span><span id="hudR"></span></div>
<div id="cakeHud"><span>🧁</span><div id="cakeBar"><div id="cakeFill"></div></div><span id="cakePct">0%</span></div>
<button id="pauseB">⏸</button>
<div id="pauseOv" class="hide">PAUSED</div>
<div id="scoreOv" class="ov hide">
  <div class="stars" id="sStars"></div>
  <div class="cake-r" id="sCake"></div>
  <div class="card">
    <div class="row"><span class="rl">Score</span><span class="rv" id="sScore"></span></div>
    <div class="row"><span class="rl">🍎 Apples</span><span class="rv" id="sApples"></span></div>
    <div class="row"><span class="rl">🏁 Crossings</span><span class="rv" id="sCross"></div>
    <div class="row"><span class="rl">🧁 Cake</span><span class="rv" id="sCakePct"></span></div>
    <div class="row"><span class="rl">🏆 Best</span><span class="rv" id="sBest"></span></div>
  </div>
  <button class="btn btn-red" id="rBtn">TRY AGAIN</button>
  <button class="btn btn-out" id="shBtn">📤 Share</button>
  <button class="btn btn-out" id="hBtn">🏠 Home</button>
</div>
<script>
(function(){
// CONFIG — Frogger-style lanes: bottom=start, top=goal
// Each lane has a type, speed, direction
const LANES=[
  {type:'safe', spd:0,   dir:0,  obs:false, color:'#C8E6C9', label:'🏠 HOME'},     // 0: goal (top)
  {type:'safe', spd:0,   dir:0,  obs:false, color:'#D7CCC8', label:''},             // 1: safe zone
  {type:'road', spd:100, dir:1,  obs:true,  color:'#607D8B', label:'🚗'},           // 2: slow road →
  {type:'road', spd:150, dir:-1, obs:true,  color:'#607D8B', label:'🚙'},           // 3: medium road ←
  {type:'safe', spd:0,   dir:0,  obs:false, color:'#C8E6C9', label:''},             // 4: safe with apples
  {type:'road', spd:200, dir:1,  obs:true,  color:'#546E7A', label:'🏎️'},           // 5: fast road →
  {type:'safe', spd:0,   dir:0,  obs:false, color:'#D7CCC8', label:''},             // 6: safe
  {type:'road', spd:130, dir:-1, obs:true,  color:'#546E7A', label:'🚕'},           // 7: road ←
  {type:'road', spd:170, dir:1,  obs:true,  color:'#455A64', label:'🛻'},           // 8: road →
  {type:'safe', spd:0,   dir:0,  obs:false, color:'#C8E6C9', label:'🌳'},           // 9: safe with apples
  {type:'road', spd:120, dir:-1, obs:true,  color:'#607D8B', label:'🚗'},           // 10: road ←
  {type:'safe', spd:0,   dir:0,  obs:false, color:'#D7CCC8', label:''},             // 11: safe
  {type:'road', spd:190, dir:1,  obs:true,  color:'#546E7A', label:'🚙'},           // 12: road →
  {type:'safe', spd:0,   dir:0,  obs:false, color:'#FFF9C4', label:'🏁 START'},     // 13: start (bottom)
];
const NUM_LANES=LANES.length;

// CANVAS
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
let W,H,cellH;
function resize(){
  const d=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*d;canvas.height=H*d;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);
  cellH=Math.ceil(H/12); // show ~12 lanes on screen
}
window.addEventListener('resize',resize);resize();

// STATE
let player={x:0,row:13,targetRow:13,size:0,inv:0,char:'🧑‍🌾',moveT:0,prevRow:13};
let obstacles=[],apples=[],particles=[];
let score=0,applesN=0,crossings=0,cakePct=0,hearts=3,combo=1,streak=0;
let golden=0,frozen=0,gT=0,fT=0;
let running=false,paused=false,lastTime=0;
let time=0;
let best=parseInt(localStorage.getItem('abest')||'0');

// INIT OBSTACLES
function initObs(){
  obstacles=[];
  for(let r=0;r<NUM_LANES;r++){
    obstacles[r]=[];
    if(!LANES[r].obs)continue;
    const n=3+Math.floor(Math.random()*2);
    const gap=W/(n+1);
    for(let i=0;i<n;i++){
      obstacles[r].push({
        x:gap*(i+1)+(Math.random()-.5)*gap*.4,
        w:Math.round(cellH*(1+Math.random()*.5)),
        h:Math.round(cellH*.65),
        spd:LANES[r].spd*LANES[r].dir,
        col:LANES[r].spd>160?'#E53935':LANES[r].spd>120?'#FB8C00':'#78909C',
      });
    }
  }
}

// INIT APPLES on safe rows
function initApples(){
  apples=[];
  for(let r=0;r<NUM_LANES;r++){
    if(LANES[r].obs||r===0||r===NUM_LANES-1)continue;
    const n=1+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){
      apples.push({
        x:cellH+Math.random()*(W-cellH*2),
        row:r,
        type:Math.random()>.8?'🌟':'🍏',
        pts:Math.random()>.8?50:10,
        active:true,
      });
    }
  }
}

function initGame(){
  resize();
  player={x:W/2,row:NUM_LANES-1,targetRow:NUM_LANES-1,size:cellH*.7,inv:0,char:'🧑‍🌾',moveT:0,prevRow:NUM_LANES-1};
  initObs();initApples();
  particles=[];score=0;applesN=0;crossings=0;cakePct=0;
  hearts=3;combo=1;streak=0;golden=0;frozen=0;gT=0;fT=0;
  time=0;running=true;paused=false;
  document.getElementById('pauseB').classList.add('show');
  document.getElementById('scoreOv').classList.add('hide');
  document.getElementById('splash').classList.add('hide');
  lastTime=performance.now();
  requestAnimationFrame(frame);
}

// PLAYER MOVE
function move(dir){
  if(!running||paused)return;
  initAudio();
  const p=player;
  if(dir==='up'&&p.targetRow>0){p.targetRow--;p.moveT=0;p.prevRow=p.row;sndJump();vib(15)}
  else if(dir==='down'&&p.targetRow<NUM_LANES-1){p.targetRow++;p.moveT=0;p.prevRow=p.row;sndJump();vib(15)}
  else if(dir==='left'&&p.targetX>p.size){p.targetX-=cellH*.7;sndJump();vib(15)}
  else if(dir==='right'&&p.targetX<W-p.size){p.targetX+=cellH*.7;sndJump();vib(15)}
}
let playerTargetX=W/2;

// AUDIO
let ac;
function initAudio(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)}
function snd(f,d,v,t){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function sndJump(){snd(523,.06,.08);setTimeout(()=>snd(658,.08,.08),35)}
function sndCollect(){snd(880,.07,.1);setTimeout(()=>snd(1105,.1,.08),40)}
function sndHit(){snd(160,.2,.12,'sawtooth');snd(120,.25,.08,'square')}
function sndCross(){snd(659,.08);setTimeout(()=>snd(784,.08),60);setTimeout(()=>snd(1046,.15),120)}
function sndDie(){snd(440,.12);setTimeout(()=>snd(330,.12),100);setTimeout(()=>snd(220,.25),200)}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

// MAIN LOOP
function frame(now){
  if(!running)return;
  const dt=paused?0:Math.min((now-lastTime)/1000,.05);
  lastTime=now;
  time+=dt;
  if(!paused)update(dt);
  render();
  requestAnimationFrame(frame);
}

function update(dt){
  const p=player;
  const diffScale=1+time*.006;

  // Lerp player Y
  p.moveT=Math.min(p.moveT+dt*8,1);
  const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
  p.row=p.prevRow+(p.targetRow-p.prevRow)*ease(p.moveT);
  p.x=p.x+(playerTargetX-p.x)*.2;

  // Invincibility
  if(p.inv>0)p.inv-=dt;
  if(golden>0){gT-=dt;if(gT<=0){golden=0;gT=0}}
  if(frozen>0){fT-=dt;if(fT<=0){frozen=0;fT=0}}

  // Move obstacles
  for(let r=0;r<NUM_LANES;r++){
    if(!LANES[r].obs)continue;
    for(const o of obstacles[r]){
      o.x+=o.spd*diffScale*dt;
      if(o.spd>0&&o.x>W+o.w)o.x=-o.w;
      if(o.spd<0&&o.x+o.w<0)o.x=W+o.w;
    }
  }

  // Apple collect
  const pScreenY=laneToY(p.row);
  for(let i=apples.length-1;i>=0;i--){
    const a=apples[i];
    if(!a.active||a.row!==Math.round(p.row))continue;
    if(Math.abs(a.x-p.x)<cellH*.7){
      a.active=false;
      applesN++;streak++;
      score+=a.pts*combo;
      cakePct=Math.min(100,cakePct+a.pts*.15);
      particles.push({x:p.x,y:pScreenY,vx:0,vy:-3,life:1,t:a.type,s:20});
      sndCollect();vib(30);
      if(streak>=5){combo=Math.min(combo+1,5);streak=0}
      if(a.type==='🌟'){golden=5;gT=5}
    }
  }
  apples=apples.filter(a=>a.active);

  // Obstacle collision
  if(p.inv<=0&&frozen<=0){
    const pr=Math.round(p.row);
    if(pr>=0&&pr<NUM_LANES&&LANES[pr].obs){
      for(const o of obstacles[pr]){
        if(p.x>o.x-o.w/2&&p.x<o.x+o.w/2){
          hearts--;combo=1;streak=0;p.inv=1.5;
          for(let i=0;i<6;i++)particles.push({x:p.x,y:pScreenY,vx:(Math.random()-.5)*6,vy:-Math.random()*5,life:1,t:'💥',s:16});
          sndDie();vib([50,30,80]);
          if(hearts<=0){gameOver();return}
          p.targetRow=NUM_LANES-1;p.prevRow=NUM_LANES-1;p.row=NUM_LANES-1;p.moveT=0;
          playerTargetX=W/2;
        }
      }
    }
  }

  // Reached goal (top)
  if(p.targetRow<=0){
    crossings++;score+=100*crossings;cakePct=Math.min(100,cakePct+10);
    sndCross();vib([30,20,30,20,50]);
    for(let i=0;i<8;i++)particles.push({x:p.x,y:pScreenY,vx:(Math.random()-.5)*4,vy:-Math.random()*4-1,life:1,t:'🎉',s:18});
    p.targetRow=NUM_LANES-1;p.prevRow=NUM_LANES-1;p.row=NUM_LANES-1;p.moveT=0;
    playerTargetX=W/2;
    initObs();initApples();
    for(const l of LANES)l.spd*=1.015;
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    particles[i].x+=particles[i].vx;
    particles[i].y+=particles[i].vy;
    particles[i].vy+=.12;
    particles[i].life-=dt*2.5;
    if(particles[i].life<=0)particles.splice(i,1);
  }
}

function laneToY(r){return H-(r+1)*cellH+time*20%cellH}

// RENDER
function render(){
  ctx.clearRect(0,0,W,H);
  const camY=time*15%cellH;

  // Draw lanes
  const startRow=Math.max(0,Math.floor((H-camY)/cellH)-1);
  const endRow=Math.min(NUM_LANES,startRow+14);

  for(let r=startRow;r<endRow;r++){
    const y=H-(r+1)*cellH+camY;
    if(y>cellH||y<-cellH)continue;

    // Lane bg
    ctx.fillStyle=LANES[r].color;
    ctx.fillRect(0,y,W,cellH+1);

    // Road markings
    if(LANES[r].obs){
      ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.setLineDash([18,14]);
      const off=(time*LANES[r].spd)%32;
      for(let xx=-off;xx<W;xx+=32){
        ctx.beginPath();ctx.moveTo(xx,y+cellH/2);ctx.lineTo(xx+18,y+cellH/2);ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    // Obstacles
    if(LANES[r].obs&&obstacles[r]){
      ctx.textAlign='center';ctx.textBaseline='middle';
      for(const o of obstacles[r]){
        const oy=y+cellH/2;
        // Body
        ctx.fillStyle=o.col;
        ctx.beginPath();
        ctx.roundRect(o.x-o.w/2,y+cellH*.18,o.w,o.h,[8,8,4,4]);
        ctx.fill();
        // Highlight
        ctx.fillStyle='rgba(255,255,255,.18)';
        ctx.fillRect(o.x-o.w/2+3,y+cellH*.18+2,o.w-6,o.h*.3);
        // Emoji
        ctx.font=Math.round(cellH*.45)+'px serif';
        ctx.fillText(LANES[r].label,o.x,oy);
      }
    }

    // Label
    if(LANES[r].label){
      ctx.globalAlpha=.35;ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillStyle='#333';
      ctx.fillText(LANES[r].label,6,y+cellH-6);
      ctx.globalAlpha=1;
    }
  }

  // Apples on safe rows
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const a of apples){
    if(!a.active)continue;
    const ay=H-(a.row+1)*cellH+camY+cellH/2;
    if(ay>-cellH&&ay<H+cellH){
      ctx.font=Math.round(cellH*.5)+'px serif';
      ctx.fillText(a.type,a.x,ay);
    }
  }

  // Player
  const p=player;
  const py=H-(p.row+1)*cellH+camY+cellH/2;
  // Shadow
  ctx.globalAlpha=.18;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(p.x,py+p.size*.3,p.size*.35,p.size*.1,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  // Body
  if(p.inv<=0||Math.floor(time*8)%2){
    ctx.font=Math.round(p.size)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.char,p.x,py);
  }
  // Golden glow
  if(golden>0){
    ctx.globalAlpha=Math.min(gT,.4);ctx.fillStyle='#FFD700';
    ctx.beginPath();ctx.arc(p.x,py,p.size*.8,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  // Particles
  for(const pt of particles){
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.font=pt.s+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pt.t,pt.x,pt.y);
  }
  ctx.globalAlpha=1;

  // HUD
  document.getElementById('hudL').textContent=''.repeat(hearts)+'❤️'.repeat(hearts)+'🖤'.repeat(Math.max(0,3-hearts));
  document.getElementById('hudR').innerHTML='<div>⭐ '+score.toLocaleString()+'</div><div>🍎 '+applesN+'</div><div>🏁 x'+crossings+'</div>';
  document.getElementById('cakeFill').style.width=cakePct+'%';
  document.getElementById('cakePct').textContent=Math.floor(cakePct)+'%';
}

// GAME OVER
function gameOver(){
  running=false;
  document.getElementById('pauseB').classList.remove('show');
  if(score>best){best=score;localStorage.setItem('abest',best)}
  const ss=cakePct>=100?'★★★':cakePct>=50?'★★☆':'★☆☆';
  document.getElementById('sStars').textContent=ss;
  document.getElementById('sCake').textContent=cakePct>=100?'PERFECT CAKE! 🎂':cakePct>=50?'Golden! ✨':'Burnt! 🔥';
  document.getElementById('sScore').textContent=score.toLocaleString();
  document.getElementById('sApples').textContent=applesN;
  document.getElementById('sCross').textContent=crossings;
  document.getElementById('sCakePct').textContent=Math.floor(cakePct)+'%';
  document.getElementById('sBest').textContent=best.toLocaleString();
  document.getElementById('scoreOv').classList.remove('hide');
}

// CONTROLS
let tSx=0,tSy=0;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  const t=e.touches[0];tSx=t.clientX;tSy=t.clientY;
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const dx=t.clientX-tSx,dy=t.clientY-tSy;
  if(Math.abs(dy)>Math.abs(dx)){
    move(dy<0?'up':'down');
  } else if(Math.abs(dx)>15){
    move(dx<0?'left':'right');
  }
},{passive:false});
document.addEventListener('keydown',e=>{
  if(!running||paused)return;
  if(e.key==='ArrowUp'||e.key==='w'){move('up');e.preventDefault()}
  if(e.key==='ArrowDown'||e.key==='s'){move('down');e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='a'){move('left');e.preventDefault()}
  if(e.key==='ArrowRight'||e.key==='d'){move('right');e.preventDefault()}
  if(e.key===' '){paused=!paused;document.getElementById('pauseOv').classList.toggle('hide',!paused)}
});
document.getElementById('pauseB').addEventListener('click',()=>{paused=!paused;document.getElementById('pauseOv').classList.toggle('hide',!paused)});

// BUTTONS
document.getElementById('pBtn').addEventListener('click',()=>{initAudio();initGame()});
document.getElementById('rBtn').addEventListener('click',initGame);
document.getElementById('hBtn').addEventListener('click',()=>{running=false;document.getElementById('pauseB').classList.remove('show');document.getElementById('scoreOv').classList.add('hide');document.getElementById('splash').classList.remove('hide')});
document.getElementById('shBtn').addEventListener('click',()=>{
  try{navigator.share({text:'🧁 Scored '+score+' in Apple Cake Season! Crossings: '+crossings+', Apples: '+applesN})}catch(e){}
});

// RoundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r=[r,r,r,r];
    this.moveTo(x+r[0],y);this.lineTo(x+w-r[1],y);this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);this.quadraticCurveTo(x,y,x+r[0],y);this.closePath();
  };
}

// Splash fruit rain
const fruits=['🍎','🍏','🧁','🍐','🍊','🌳','🍋'];
setInterval(()=>{
  if(!document.getElementById('splash').classList.contains('hide'))return;
  const f=document.createElement('div');f.className='fp';
  f.textContent=fruits[Math.floor(Math.random()*fruits.length)];
  f.style.left=Math.random()*90+5+'vw';
  f.style.animationDuration=(4+Math.random()*4)+'s';
  document.getElementById('splash').appendChild(f);
  setTimeout(()=>f.remove(),8000);
},350);

})();
</script>
